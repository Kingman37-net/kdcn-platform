<!DOCTYPE html>
<html>
<head>
    <title>KDCN Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0f14; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; width: 400px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .login-box h2 { color: #0a0f14; }
        .btn-primary { background: #00d1ff; border: none; }
        .btn-primary:hover { background: #0b7fab; }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo h1 { color: #00d1ff; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <h1>KDCN</h1>
            <p style="color: #6c757d;">Digital Cyber Network</p>
        </div>
        <h2 class="text-center">Login</h2>
        {% if form.errors %}
        <div class="alert alert-danger">Invalid username or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>
        <p class="mt-3 text-center"><a href="/admin/">Admin Login</a></p>
    </div>
</body>
</html>
