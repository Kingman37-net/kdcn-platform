name: Import D1 Schema

on:
  workflow_dispatch:
    inputs:
      schema_file:
        description: 'Path to SQL file (relative to V2/)'
        required: true
        default: 'V2/database/schema/0001_init.sql'
      mode:
        description: 'remote or local'
        required: true
        default: 'remote'

permissions:
  contents: read

jobs:
  import:
    name: Execute SQL against D1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: V2/workers
        run: npm install

      - name: Execute SQL against D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEMA_FILE: ${{ github.event.inputs.schema_file }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          echo "▶ Working directory: $(pwd)"
          echo "▶ Schema file:       $SCHEMA_FILE"
          echo "▶ Mode:              $MODE"
          echo "▶ Checking files..."
          ls -la "$SCHEMA_FILE"
          echo ""
          cd V2/workers
          echo "▶ From worker dir: $(pwd)"
          ls -la wrangler.jsonc
          echo ""
          echo "▶ Running wrangler d1 execute..."
          npx --yes wrangler@latest d1 execute kdcn-platform --$MODE --file=../${SCHEMA_FILE#V2/}
