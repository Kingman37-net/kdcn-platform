name: Set Worker Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: V2/workers
        run: npm install

      - name: Set JWT_SECRET
        working-directory: V2/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET_VALUE: ${{ secrets.PLATFORM_JWT_SECRET }}
        run: |
          echo "$JWT_SECRET_VALUE" | npx --yes wrangler@latest secret put JWT_SECRET
