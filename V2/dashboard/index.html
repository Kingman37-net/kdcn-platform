<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | KDCN Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://media.kingmandigital.co.ke/favicon/favicon.ico" type="image/png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .sidebar { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 18px; height: fit-content; position: sticky; top: 80px; }
    .sidebar .user-info { text-align: center; padding-bottom: 14px; border-bottom: 1px solid var(--card-border); margin-bottom: 14px; }
    .sidebar .user-info .avatar { font-size: 2.5rem; display: block; }
    .sidebar .user-info .name { color: var(--text-primary); font-weight: 700; }
    .sidebar .user-info .email { color: var(--text-muted); font-size: 0.8rem; word-break: break-all; }
    .sidebar nav a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--text-primary); font-size: 0.9rem; margin-bottom: 2px; transition: background 0.2s; }
    .sidebar nav a:hover, .sidebar nav a.active { background: rgba(0,209,255,0.12); color: var(--accent); }
    .sidebar nav a.active { background: var(--accent); color: #0a0f14; font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 18px; text-align: center; }
    .stat .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat .lbl { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-container">
    <div class="logo">
      <img src="https://media.kingmandigital.co.ke/website/store/logo/kdcn-web-logo-500.webp" alt="KDCN" />
    </div>
    <ul class="nav-menu">
      <li><a href="index.html" class="active">Dashboard</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="services.html">Services</a></li>
    </ul>
    <button id="logoutBtn" class="btn btn-secondary" style="padding:6px 14px;font-size:0.85rem;">Logout</button>
  </div>
</nav>

<div class="layout">

  <aside class="sidebar">
    <div class="user-info">
      <span class="avatar">👤</span>
      <div class="name" id="sideName">—</div>
      <div class="email" id="sideEmail">—</div>
    </div>
    <nav>
      <a href="index.html" class="active">📊 Dashboard</a>
      <a href="clients.html">🏢 Clients</a>
      <a href="projects.html">📁 Projects</a>
      <a href="services.html">⚙️ Services</a>
    </nav>
  </aside>

  <main>
    <h1 style="margin-bottom:20px;color:var(--accent);">Dashboard</h1>

    <div class="stats" id="stats">
      <div class="stat"><div class="num" id="st-clients">—</div><div class="lbl">Clients</div></div>
      <div class="stat"><div class="num" id="st-projects">—</div><div class="lbl">Total Projects</div></div>
      <div class="stat"><div class="num" id="st-active">—</div><div class="lbl">Active</div></div>
      <div class="stat"><div class="num" id="st-services">—</div><div class="lbl">Services</div></div>
    </div>

    <div class="card">
      <h3>Recent Clients</h3>
      <div id="recentClients">Loading...</div>
    </div>

    <div class="card">
      <h3>Recent Projects</h3>
      <div id="recentProjects">Loading...</div>
    </div>
  </main>

</div>

<script src="assets/js/api.js"></script>
<script>
(function () {
  if (!Session.has()) { window.location.href = 'login.html'; return; }

  const user = Session.user || {};
  document.getElementById('sideName').textContent = user.display_name || '—';
  document.getElementById('sideEmail').textContent = user.email || '—';

  document.getElementById('logoutBtn').addEventListener('click', async function () {
    try {
      await apiFetch('/auth/logout', { method: 'POST', body: { refresh_token: Session.refreshToken } });
    } catch (e) { /* ignore */ }
    Session.clear();
    window.location.href = 'login.html';
  });

  async function load() {
    try {
      const res = await apiFetch('/dashboard');
      const d = res.data;

      document.getElementById('st-clients').textContent = d.counts.clients;
      document.getElementById('st-projects').textContent = d.counts.projects_total;
      document.getElementById('st-active').textContent = d.counts.projects_active;
      document.getElementById('st-services').textContent = d.counts.services_total;

      const rc = document.getElementById('recentClients');
      if (!d.recent_clients.length) {
        rc.innerHTML = '<p style="color:var(--text-muted);">No clients yet.</p>';
      } else {
        let html = '<table><tr><th>Company</th><th>Created</th></tr>';
        for (const c of d.recent_clients) {
          html += '<tr><td>' + escapeHtml(c.company_name) + '</td><td>' + formatDate(c.created_at) + '</td></tr>';
        }
        rc.innerHTML = html + '</table>';
      }

      const rp = document.getElementById('recentProjects');
      if (!d.recent_projects.length) {
        rp.innerHTML = '<p style="color:var(--text-muted);">No projects yet.</p>';
      } else {
        let html = '<table><tr><th>Project</th><th>Client</th><th>Status</th></tr>';
        for (const p of d.recent_projects) {
          html += '<tr><td>' + escapeHtml(p.name) + '</td><td>' + escapeHtml(p.client_name || '—') + '</td>' +
                  '<td><span class="badge ' + p.status + '">' + p.status + '</span></td></tr>';
        }
        rp.innerHTML = html + '</table>';
      }
    } catch (err) {
      toast('Failed to load: ' + err.message, 'error');
    }
  }

  load();
})();
</script>
</body>
</html>
