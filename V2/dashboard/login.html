<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | KDCN Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://media.kingmandigital.co.ke/favicon/favicon.ico" type="image/png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <h1>KDCN Platform</h1>
    <p class="sub">Sign in to continue</p>

    <div id="errorBox" style="display:none; background:#3b0d0d; border:1px solid #7c1414; color:#ffb4b4; padding:10px 12px; border-radius:8px; font-size:0.85rem; margin-bottom:14px;"></div>

    <form id="loginForm" autocomplete="off" onsubmit="event.preventDefault(); return false;">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@kingmandigital.co.ke" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">Sign In</button>
    </form>
  </div>
</div>

<script>
  // --- Failsafe error display (runs first, before api.js) ---
  function showError(msg) {
    const box = document.getElementById('errorBox');
    if (box) {
      box.textContent = msg;
      box.style.display = 'block';
    }
    console.error('[login]', msg);
  }

  window.addEventListener('error', function (e) {
    showError('JS error: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno);
  });
</script>

<script src="assets/js/api.js" onerror="showError('Failed to load api.js')"></script>

<script>
  // --- Main login logic ---
  (function () {
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');

    if (typeof Session === 'undefined') {
      showError('Session object not defined — api.js did not initialize.');
      return;
    }
    if (typeof API_BASE === 'undefined') {
      showError('API_BASE not defined — api.js did not initialize.');
      return;
    }

    if (Session.has()) {
      window.location.href = 'index.html';
      return;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        showError('Email and password are required.');
        return;
      }

      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch(API_BASE + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
        const body = await res.json().catch(function () { return null; });

        if (!res.ok || !body || !body.ok) {
          showError((body && body.error && body.error.message) || 'Login failed');
          btn.disabled = false;
          btn.textContent = original;
          return;
        }

        Session.accessToken = body.data.access_token;
        Session.refreshToken = body.data.refresh_token;
        Session.user = body.data.user;
        window.location.href = 'index.html';
      } catch (err) {
        showError('Network error: ' + err.message);
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  })();
</script>
</body>
</html>
